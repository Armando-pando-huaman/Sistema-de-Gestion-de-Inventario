<!doctype html><meta charset="utf-8"><title>Pruebas del lector de productos</title>
<form data-product-autofill><input name="codigo_barras"><input name="nombre"><textarea name="descripcion"></textarea><input name="fecha_vencimiento" type="date"><input name="lote_inicial"></form>
<span id="fv-product-data-status"></span><a id="fv-existing-product" hidden></a><pre id="result">PENDING</pre>
<script>
window.fetch=async()=>({ok:true,json:async()=>({producto:null,ambiguo:false})});
</script>
<script src="../public/js/fv-product-data.js"></script>
<script>
(async()=>{
 const results=[],test=(name,ok)=>{results.push({name,ok});if(!ok)throw new Error(name);};
 const decode=FvProductData.decode,form=document.querySelector('form');
 try{
  test('Código simple conserva ceros',decode('0012345678905').codigo_barras==='0012345678905');
  const json=decode('{"codigo":"ABC","nombre":"Jabón","descripcion":"Neutro","fecha_vencimiento":"2028-04-30","lote":"L001"}');
  test('JSON con ficha completa',json.nombre==='Jabón'&&json.descripcion==='Neutro'&&json.fecha_vencimiento==='2028-04-30'&&json.lote==='L001');
  const hri=decode('(01)09506000134352(17)270200(10)LOT001');
  test('GS1 y último día de mes',hri.codigo_barras==='09506000134352'&&hri.fecha_vencimiento==='2027-02-28'&&hri.lote==='LOT001');
  const gs=decode(']d201095060001343521727022810ABC');
  test('GS1 con prefijo de escáner',gs.fecha_vencimiento==='2027-02-28'&&gs.lote==='ABC');
  const link=decode('https://id.gs1.org/01/09506000134352/10/BATCH9?17=280229');
  test('GS1 Digital Link',link.codigo_barras==='09506000134352'&&link.lote==='BATCH9'&&link.fecha_vencimiento==='2028-02-29');
  const bad=decode('{"nombre":"Prueba","vencimiento":"2027-02-31"}');
  test('Fecha imposible no se carga',bad.fecha_vencimiento===''&&bad.warnings.length>0);
  const pairs=decode('codigo: ABC; nombre: Guantes; descripcion: Caja; vencimiento: 31/12/2028');
  test('Campos de texto',pairs.nombre==='Guantes'&&pairs.fecha_vencimiento==='2028-12-31');
  const scan=async value=>{form.elements.codigo_barras.dispatchEvent(new CustomEvent('fv:scan',{cancelable:true,detail:{value}}));await new Promise(r=>setTimeout(r,0));};
  await scan('{"codigo":"A1","nombre":"Automático","descripcion":"Primera ficha","vencimiento":"2028-01-01"}');
  test('Completa campos al escanear',form.elements.nombre.value==='Automático'&&form.elements.fecha_vencimiento.value==='2028-01-01');
  form.elements.nombre.value='Nombre escrito a mano';
  await scan('{"codigo":"B2","nombre":"Otro","descripcion":"Segunda ficha"}');
  test('Conserva datos manuales',form.elements.nombre.value==='Nombre escrito a mano');
  test('No arrastra vencimiento del producto anterior',form.elements.fecha_vencimiento.value==='');
  await scan('C3');test('No arrastra descripción de otro código',form.elements.descripcion.value==='');
  window.fetch=async()=>({ok:true,json:async()=>({producto:{id:5,nombre:'Catálogo local',descripcion:'Descripción local',activo:1},ambiguo:false})});
  form.elements.nombre.value='';await scan('D4');
  test('Consulta ficha local y ofrece enlace',form.elements.nombre.value==='Catálogo local'&&!document.getElementById('fv-existing-product').hidden);
 }catch(error){results.push({error:error.message,ok:false});}
 document.getElementById('result').textContent=JSON.stringify(results);
})();
</script>
